baseURL: "https://my-blog-alpha-beige.vercel.app/"
languageCode: "zh-cn"
title: "MRHE | 荷尔蒙君"

# 核心设置
defaultContentLanguage: "zh"
defaultContentLanguageInSubdir: false

params:
  title: "MRHE"
  description: "愉悦主义潮玩与感官科学"
  favicon: "/fav.png"
  useBootstrapCDN: true
  animate: true
  color:
    backgroundColor: "#f3f6f9"        # 首页背景色（高级灰）
    primaryColor: "#007bff"           # 主色调
    textColor: "#2c3e50"              # 主文字颜色
    darkmode:
      backgroundColor: "#18191a"

  # 导航栏设置
  navbar:
    align: ms-auto
    brandName: "MRHE"
    stickyNavBar:
      enable: true
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableContact: false

  # 首页英雄区 (已修复 bool 类型报错)
  hero:
    enable: true
    intro: "你好，我是"
    title: "荷尔蒙君。"
    subtitle: "专注愉悦主义潮玩与感官科学"
    content: "小怪兽（Monster Pub）品牌主理人。"
    image: /images/hero.svg
    button:
      enable: true
      name: "联系我"
      url: "#contact"
      download: false
      newPage: true

  # 关于我
  about:
    enable: true
    title: "关于我"
    content: |-
      我是荷尔蒙君，一名深耕情趣用品行业的品牌操盘手。致力于将成人用品带向“愉悦主义潮玩”的新赛道。

# 导航菜单 (确保 Menus 开头没有多余空格)
Menus:
  main:
    - identifier: blog
      name: 博客
      url: /blog
      weight: 1
    - identifier: gallery
      name: 画廊
      url: /gallery
      weight: 2

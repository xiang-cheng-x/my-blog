baseURL: "https://my-blog-alpha-beige.vercel.app/"
languageCode: "zh-cn"
title: "MRHE | 荷尔蒙君"

# 核心设置
defaultContentLanguage: "zh"
defaultContentLanguageInSubdir: false

params:
  title: "MRHE"
  description: "愉悦主义潮玩与感官科学"
  favicon: "/fav.png"
  useBootstrapCDN: true
  animate: true

  # 【修复关键点】：主题配置改为对象格式
  theme:
    default: "dark"
    disableThemeToggle: false

  # 导航栏设置
  navbar:
    align: ms-auto
    brandName: "PROCE" 
    stickyNavBar:
      enable: true
    menus:
      disableAbout: false
      disableContact: false

  # 首页英雄区
  hero:
    enable: true
    intro: "" 
    title: "PROCE.me" 
    subtitle: "通过 [认知神经学 × 前卫艺术 × 暗网级数据] 熔炼的超限亲密重构指南"
    content: "这里没有教育，只有始终在进化迭代的肉身宣言。"
    image: "/images/site-bg.jpg" 
    button:
      enable: true
      name: "开始探索"
      url: "#about"
      download: false
      newPage: false
    social:
      enable: true
      items:
        - icon: "fab fa-weibo"
          url: "#"
        - icon: "fab fa-instagram"
          url: "#"

  # 关于区域
  about:
    enable: true
    title: "你好啊，旁友～！"
    content: |-
      性，是人体最后的野生边疆。而我，是你们的拓荒者与制图师。

# 底部菜单链接
Menus:
  main:
    - identifier: power
      name: POWer 教程
      url: /power
      weight: 1
    - identifier: tools
      name: 工具/专题
      url: /tools
      weight: 2
